<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <!-- Majestic Golden-Terracotta Gradient matching SAP Brand Identity -->
    <linearGradient id="sapBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#ea580c" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <g id="sap-emblem" filter="url(#subtleGlow)">
    <!-- Rising Sun / Third Eye of Conscious Discernment -->
    <circle cx="50" cy="19" r="4" fill="url(#sapBrandGrad)" />
    <path 
      d="M37,27 A14,14 0 0 1 63,27" 
      fill="none" 
      stroke="url(#sapBrandGrad)" 
      stroke-width="2.5" 
      stroke-linecap="round" 
    />

    <!-- Outer Arch / Grand Dome of Parliament & Governance -->
    <path 
      d="M20,54 A30,30 0 0 1 80,54" 
      fill="none" 
      stroke="url(#sapBrandGrad)" 
      stroke-width="3" 
      stroke-linecap="round" 
    />

    <!-- Inner Concentric Arch -->
    <path 
      d="M29,54 A21,21 0 0 1 71,54" 
      fill="none" 
      stroke="url(#sapBrandGrad)" 
      stroke-width="2.5" 
      stroke-linecap="round" 
      opacity="0.88" 
    />

    <!-- The 5 Pillars of Awakened Governance (Integrity, Empathy, Morality, Service, Wisdom) -->
    <line x1="28" y1="54" x2="28" y2="73" stroke="url(#sapBrandGrad)" stroke-width="2.8" stroke-linecap="round" />
    <line x1="39" y1="54" x2="39" y2="73" stroke="url(#sapBrandGrad)" stroke-width="2.8" stroke-linecap="round" />
    <line x1="50" y1="54" x2="50" y2="73" stroke="url(#sapBrandGrad)" stroke-width="3"   stroke-linecap="round" />
    <line x1="61" y1="54" x2="61" y2="73" stroke="url(#sapBrandGrad)" stroke-width="2.8" stroke-linecap="round" />
    <line x1="72" y1="54" x2="72" y2="73" stroke="url(#sapBrandGrad)" stroke-width="2.8" stroke-linecap="round" />

    <!-- Sub-Plinth Connecting the Columns -->
    <rect 
      x="22" 
      y="73" 
      width="56" 
      height="4" 
      rx="2" 
      fill="url(#sapBrandGrad)" 
      opacity="0.9" 
    />

    <!-- Foundational Base Plinth -->
    <rect 
      x="16" 
      y="78" 
      width="68" 
      height="5.5" 
      rx="2.75" 
      fill="url(#sapBrandGrad)" 
    />
  </g>
</svg>
