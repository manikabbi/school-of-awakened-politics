<svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" viewBox="0 0 70 70">
  <defs>
    <linearGradient id="sapGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#c85a17" />
    </linearGradient>
    <style>
      .g{fill:url(#sapGold);stroke:url(#sapGold)}
      .s{fill:none;stroke:url(#sapGold);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  
  <g transform="translate(5 5)">
    <!-- Arch / Dome -->
    <path class="s" d="M10,32 A22,22 0 0 1 50,32"></path>
    <path class="s" d="M17,32 A15,15 0 0 1 43,32" opacity=".85"></path>

    <!-- Pillars of Governance -->
    <line x1="20" y1="32" x2="20" y2="47" class="s"></line>
    <line x1="27" y1="32" x2="27" y2="47" class="s"></line>
    <line x1="33" y1="32" x2="33" y2="47" class="s"></line>
    <line x1="40" y1="32" x2="40" y2="47" class="s"></line>

    <!-- Base Plinth -->
    <rect x1="16" y="47" width="28" height="4.5" rx="1.5" class="g" opacity=".9"></rect>

    <!-- Rising Sun / Third Eye of Discernment -->
    <circle cx="30" cy="15" r="2.6" class="g"></circle>
    <path class="s" d="M23,19 A8,8 0 0 1 37,19"></path>
  </g>
</svg>
